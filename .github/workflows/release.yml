name: Release

# Pushing a tag like v1.2.3 publishes that version:
#   - a container image to the GitHub Container Registry (ghcr.io)
#   - a Linux x86-64 binary and its checksum
#   - a GitHub Release carrying both, with the notes from CHANGELOG.md

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    container: rust:1.99-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: The tag must match the version in Cargo.toml
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $version, tag: $tag"
          test "$version" = "$tag"
      - name: Lint and test
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  binary:
    name: Linux binary
    needs: verify
    runs-on: ubuntu-latest
    # Built on Debian 12 so the binary runs on any distribution with
    # glibc 2.36 or newer.
    container: rust:1.99-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p mer
      - name: Package
        run: |
          name="mer-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/mer LICENSE README.md CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          ./target/release/mer --version
      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: |
            mer-*.tar.gz
            mer-*.tar.gz.sha256
          if-no-files-found: error

  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [binary, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section between this version's heading and the next one.
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          image=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          {
            echo
            echo "## Get it"
            echo
            echo '```bash'
            echo "docker pull ${image}:${version}"
            echo '```'
            echo
            echo "Or download the Linux binary below and check it against the \`.sha256\` file."
          } >> notes.md
          test -s notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            mer-*.tar.gz
            mer-*.tar.gz.sha256
          fail_on_unmatched_files: true
