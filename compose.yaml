# Two-node demo. Run it with: bash deploy/demo.sh
#
#   collector  has the "internet" network and the diode link
#   vault      has ONLY the diode link (internal network: no route out)
#   media      a shared volume standing in for a USB stick carried by hand
#
# A real data diode is hardware that physically cannot send back. The
# "diode" network here is an ordinary internal network; the software simply
# never sends anything from the vault side.
name: mer-demo

services:
  collector:
    build: .
    image: mer:dev
    entrypoint: ["sleep", "infinity"]
    networks: [internet, diode]
    # Optional, for collectors that reach the internet through a proxy:
    # MER_HTTPS_PROXY=http://proxy:3128 bash deploy/demo-formats.sh
    environment:
      HTTPS_PROXY: ${MER_HTTPS_PROXY:-}
      HTTP_PROXY: ${MER_HTTP_PROXY:-}
      NO_PROXY: ${MER_NO_PROXY:-}
    volumes:
      - collector-data:/data
      - collector-keys:/keys
      - media:/media

  vault:
    image: mer:dev
    depends_on: [collector]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    volumes:
      - vault-data:/data
      - vault-keys:/keys
      - media:/media

  # A stock Debian machine inside the air gap, used by deploy/demo-apt.sh.
  # It can reach the vault and nothing else.
  client:
    image: debian:bookworm-slim
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    volumes:
      - media:/media:ro

  # Stock language clients inside the air gap, used by deploy/demo-formats.sh.
  pyclient:
    image: python:3.12-slim
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats, ldap]

  dotnetclient:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

  nodeclient:
    image: node:20-slim
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]

  rustclient:
    image: rust:1.99-bookworm
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]

  goclient:
    image: golang:1.23-bookworm
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]
    # The vault is the only module source; there is no checksum database
    # inside the air gap (the collector checked every hash against it), and
    # go must not try to download a newer toolchain.
    environment:
      GOPROXY: http://vault:8080/go/
      GOSUMDB: "off"
      GOTOOLCHAIN: local

  # A stock Alpine machine inside the air gap, an older point release than
  # the index, so that apk upgrade has work to do.
  apkclient:
    image: alpine:3.24.0
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]

  rpmclient:
    image: rockylinux:9
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]

  # A connected build machine: builds a project once so that its local
  # repository shows what the build needs (plugins included).
  # A connected machine that locks a Ruby project, and a Ruby machine
  # inside the air gap that installs it.
  rubybuild:
    image: ruby:3.4-slim
    entrypoint: ["sleep", "infinity"]
    networks: [internet]
    profiles: [formats]

  rubyclient:
    image: ruby:3.4-slim
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]

  # A connected machine that locks a PHP project, and a PHP machine inside
  # the air gap that installs it.
  phpbuild:
    image: composer:2
    entrypoint: ["sleep", "infinity"]
    networks: [internet]
    profiles: [formats]

  phpclient:
    image: composer:2
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]

  mavenbuild:
    image: maven:3.9-eclipse-temurin-21
    entrypoint: ["sleep", "infinity"]
    networks: [internet]
    profiles: [formats]

  mavenclient:
    image: maven:3.9-eclipse-temurin-21
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]

  helmclient:
    image: alpine/helm:3.16.2
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]

  # A directory server inside the air gap, used by deploy/demo-ldap.sh.
  directory:
    image: osixia/openldap:1.5.0
    hostname: directory
    networks: [diode]
    profiles: [ldap]
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-set-by-the-demo-script}
      # Clients show no certificate of their own; they check the server's.
      LDAP_TLS_VERIFY_CLIENT: try

networks:
  internet: {}
  diode:
    internal: true

volumes:
  collector-data: {}
  collector-keys: {}
  vault-data: {}
  vault-keys: {}
  media: {}
