# Two-node demo. Run it with: bash deploy/demo.sh
#
#   collector  has the "internet" network and the diode link
#   vault      has ONLY the diode link (internal network: no route out)
#   media      a shared volume standing in for a USB stick carried by hand
#
# A real data diode is hardware that physically cannot send back. The
# "diode" network here is an ordinary internal network; the software simply
# never sends anything from the vault side.
name: mer-demo

services:
  collector:
    build: .
    image: mer:dev
    entrypoint: ["sleep", "infinity"]
    networks: [internet, diode]
    volumes:
      - collector-data:/data
      - collector-keys:/keys
      - media:/media

  vault:
    image: mer:dev
    depends_on: [collector]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    volumes:
      - vault-data:/data
      - vault-keys:/keys
      - media:/media

  # A stock Debian machine inside the air gap, used by deploy/demo-apt.sh.
  # It can reach the vault and nothing else.
  client:
    image: debian:bookworm-slim
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    volumes:
      - media:/media:ro

  # Stock language clients inside the air gap, used by deploy/demo-formats.sh.
  pyclient:
    image: python:3.12-slim
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]

  dotnetclient:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

  nodeclient:
    image: node:20-slim
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [formats]

  # Stock clients for the formats added in 1.1, used by deploy/demo-more.sh.
  helmclient:
    image: alpine/helm:3.16.4
    depends_on: [vault]
    entrypoint: ["sleep", "infinity"]
    networks: [diode]
    profiles: [more]

networks:
  internet: {}
  diode:
    internal: true

volumes:
  collector-data: {}
  collector-keys: {}
  vault-data: {}
  vault-keys: {}
  media: {}
